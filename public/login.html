<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Tasklist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">

      <div class="marks">
        <span>✓</span><span>✓</span><span>✓</span>
      </div>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Log in to see what's on your list.</p>

      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com" />

        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Your password" />

        <button type="submit" class="btn-primary">Log in</button>
      </form>

      <p id="formMsg" class="form-msg hidden"></p>

      <p class="auth-switch">Don't have an account? <a href="register.html">Create one</a></p>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const formMsg = document.getElementById('formMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      formMsg.classList.add('hidden');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: emailInput.value,
            password: passwordInput.value,
          }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Something went wrong');
        }

        // Save the token — this is what every future protected request will send back
        localStorage.setItem('token', data.token);

        formMsg.textContent = 'Logged in — redirecting...';
        formMsg.className = 'form-msg success';
        formMsg.classList.remove('hidden');

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);

      } catch (err) {
        formMsg.textContent = err.message;
        formMsg.className = 'form-msg error';
        formMsg.classList.remove('hidden');
      }
    });
  </script>

</body>
</html>
